<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>तृतीयः पाठः - अलसकथा | Premium Smart-Class System</title>
  <link rel="stylesheet" href="style.css?v=28">
</head>
<body data-theme="royal">
  <main class="app-shell">
    <div class="board-grid" aria-hidden="true"></div>

    <aside class="icon-rail" aria-label="Smart class tools">
      <div class="brand-orbit" aria-label="AI">
        <span>AI</span>
      </div>

      <button class="rail-button" data-panel="index" aria-label="Index">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span class="rail-btn-label">Index</span>
      </button>

      <button class="rail-button" data-panel="summary" aria-label="Summary">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        <span class="rail-btn-label">Summary</span>
      </button>

      <button class="rail-button" data-panel="mcqs" aria-label="Quiz">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span class="rail-btn-label">Quiz</span>
      </button>

      <button class="rail-button" data-panel="subjectives" aria-label="Subjective">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span class="rail-btn-label">Subjective</span>
      </button>

      <button class="rail-button" data-panel="themes" aria-label="Theme switcher">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 14.7255 3.09032 17.1962 4.85857 19C4.85857 19 4 20 4 21C4 22 5 22 5 22C6 22 7.00001 21.1414 7.00001 21.1414C8.50201 21.7007 10.1555 22 12 22Z"/>
          <circle cx="7.5" cy="10.5" r="1.5"/>
          <circle cx="11.5" cy="7.5" r="1.5"/>
          <circle cx="16.5" cy="9.5" r="1.5"/>
          <circle cx="15.5" cy="14.5" r="1.5"/>
        </svg>
        <span class="rail-btn-label">Theme</span>
      </button>

      <button class="rail-button" data-panel="edit" aria-label="Edit slide text">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        <span class="rail-btn-label">Edit</span>
      </button>

      <button class="rail-button" data-panel="stickers" aria-label="Sticker">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
          <line x1="9" y1="9" x2="9.01" y2="9"/>
          <line x1="15" y1="9" x2="15.01" y2="9"/>
          <path d="M17 3l.5 1.5L19 5l-1.5.5L17 7l-.5-1.5L15 5l1.5-.5z" fill="currentColor" stroke="none"/>
        </svg>
        <span class="rail-btn-label">Sticker</span>
      </button>

      <button id="fullscreenBtn" class="rail-button" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        <span class="rail-btn-label">Screen</span>
      </button>
    </aside>

    <section class="presentation">
      <section class="board-card">
        <article id="slideContent" class="board-content"></article>
      </section>

      <footer class="controls">
        <button id="prevBtn" class="nav-button">Previous</button>
        <div class="progress-shell" aria-hidden="true">
          <span id="progressFill"></span>
        </div>
        <div id="footerMeter" style="font-size: 15px; font-weight: 800; color: var(--muted); margin: 0 10px;">1/1</div>
        <button id="nextBtn" class="nav-button">Next</button>
      </footer>
    </section>

    <section id="sidePanel" class="side-panel" aria-hidden="true">
      <header class="panel-header">
        <div>
          <span id="panelEyebrow">Slide 1</span>
          <h2 id="panelTitle">Summary</h2>
        </div>
        <button id="closePanel" class="panel-close" aria-label="Close panel">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </header>
      <div id="panelBody" class="panel-body"></div>
    </section>
  </main>

  <script src="script.js?v=28"></script>
</body>
</html>
